<!doctype html>
<html lang="en">

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-wash: rgba(42, 120, 214, 0.12);
  --btn: #256abf;
  --btn-hover: #1c5cab;
  --link: #1c5cab;
  --base-bar: #898781;
  --good: #006300;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.06), 0 4px 16px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #262624;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #45443f;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-wash: rgba(57, 135, 229, 0.18);
    --btn: #256abf;
    --btn-hover: #2a78d6;
    --link: #86b6ef;
    --base-bar: #7d7c75;
    --good: #0ca30c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #262624;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #45443f;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-wash: rgba(57, 135, 229, 0.18);

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
a { color: var(--link); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1080px; margin: 0 auto; padding: 14px 16px; }
.brand { font-weight: 700; letter-spacing: -0.01em; text-decoration: none; color: var(--ink); }
.brand span { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
.nav a { color: var(--ink-2); text-decoration: none; }
.nav a:hover { color: var(--ink); text-decoration: underline; }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.spacer { flex: 1; }
.toggles { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; color: var(--ink-2); cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.icon-btn { border: 0; background: var(--surface-2); color: var(--ink-2); border-radius: 8px; height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; font-size: 13.5px; }
.icon-btn:hover { color: var(--ink); }

main { max-width: 1080px; margin: 0 auto; padding: 8px 16px 48px; }
.hero { padding: 20px 0 8px; }
.eyebrow { margin: 0 0 6px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 40px); line-height: 1.15; letter-spacing: -0.02em; }
.lede { margin: 0; color: var(--ink-2); max-width: 780px; font-size: 16px; }
h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
.sub { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
.card { background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--border), var(--shadow); padding: 22px; margin-top: 20px; }

.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font-size: 12.5px; color: var(--muted); }
.btn { border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--btn); color: #ffffff; min-width: 84px; }
.btn.primary:hover { background: var(--btn-hover); }
.btn.ghost { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); }
.btn.ghost:hover { color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 650; cursor: pointer; }
.dot:hover { color: var(--ink); }
.dot[aria-current="step"] { background: var(--btn); color: #ffffff; }
.push-right { margin-left: auto; }

.step-text { margin-top: 18px; padding: 16px 18px; border-radius: 12px; background: var(--surface-2); min-height: 168px; }
.kicker { margin: 0 0 2px; color: var(--muted); font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; }
.step-text h2 { font-size: 20px; margin: 0 0 6px; }
.step-text p { margin: 0 0 8px; max-width: 900px; }
.formula { font-size: 16.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.formula, .step-body { overflow-wrap: anywhere; }
sub, sup { font-size: 72%; line-height: 0; }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.panel { margin: 0; padding: 12px 12px 6px; border-radius: 12px; box-shadow: 0 0 0 1px var(--border); min-width: 0; }
.panel figcaption { font-size: 13.5px; font-weight: 650; margin-bottom: 2px; }
.panel figcaption .tag { font-weight: 500; color: var(--muted); }
.panel svg { display: block; width: 100%; height: auto; max-width: 600px; margin: 0 auto; }
#svgB { transition: opacity 0.2s linear; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 7px; }
.lg svg { flex: none; }

.cost { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 14px 40px; align-items: start; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--grid); }
.cost-title { grid-column: 1 / -1; margin: 0; font-size: 14px; font-weight: 650; }
.cost-title span { font-weight: 400; color: var(--muted); }
.cost-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.cost-label { font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.cost-key { width: 10px; height: 10px; border-radius: 2px; background: var(--base-bar); display: inline-block; }
.cost-key.flash { background: var(--accent); }
.cost-num { font-size: 30px; font-weight: 700; line-height: 1; }
.tokens.naive { display: grid; gap: var(--tg); }
.tokens.flash { display: flex; flex-direction: column; gap: var(--tg); }
.tok { width: var(--tq); height: var(--tq); border-radius: 2px; box-shadow: inset 0 0 0 1px var(--axis); flex: none; }
.naive .tok.on { background: var(--base-bar); box-shadow: none; }
.flash .tok.on { background: var(--accent); box-shadow: none; }
.flash .tok.free { box-shadow: inset 0 0 0 1px var(--accent); opacity: 0.45; }
.frow { display: flex; align-items: center; gap: var(--tg); height: var(--tq); }
.klabel { width: 38px; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1; }
.hero-col { justify-self: end; text-align: right; max-width: 320px; }
.hero-figure { font-size: 56px; font-weight: 750; line-height: 1; letter-spacing: -0.03em; }
.hero-figure.pending { color: var(--muted); opacity: 0.5; }
.hero-label { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.match { font-size: 13px; color: var(--good); margin-top: 8px; min-height: 20px; }

.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
#scaling svg { display: block; width: 100%; height: auto; overflow: visible; }
#scaling .pt { cursor: pointer; }
#scaling .pt:focus { outline: none; }
#scaling .pt:focus-visible .pt-ring { stroke: var(--accent); stroke-width: 2; }
details.table-view { margin-top: 14px; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
table { border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
th, td { text-align: right; padding: 6px 14px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
tr.sel td { font-weight: 700; }

/* SVG roles */
.cell-bg { fill: var(--surface-2); }
.cell-bg.same { stroke: var(--accent); stroke-width: 2; }
.g-axis { stroke: var(--axis); stroke-width: 1; }
.bar-naive { fill: var(--base-bar); }
.bar-flash { fill: var(--accent); }
.ph-ring { fill: none; stroke: var(--axis); stroke-width: 1; }
.ph-arm { stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
.ph-tip { fill: var(--accent); }
.hdr { fill: var(--ink-2); font-size: 12.5px; font-weight: 650; }
.op { fill: var(--muted); font-size: 18px; }
.g-num { fill: var(--ink-2); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.g-sub { fill: var(--muted); font-size: 9.5px; }
.zero { fill: var(--muted); font-size: 11px; }
.row-hi { fill: var(--accent-wash); }
.arc { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.arrow-line { stroke: var(--ink-2); stroke-width: 1.5; }
.arrow-head { fill: var(--ink-2); }
.arrow-label { fill: var(--ink-2); font-size: 10.5px; font-weight: 650; }
.rtag { fill: var(--muted); font-size: 9px; font-weight: 700; }
.ax-grid { stroke: var(--grid); stroke-width: 1; }
.ax-base { stroke: var(--axis); stroke-width: 1; }
.ax-label { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.line-accent { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.dot-accent { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.dot-measured { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2; }
.crosshair { stroke: var(--ink-2); stroke-width: 1; }
.lbl { fill: var(--ink); font-size: 12.5px; font-weight: 650; }
.lbl-2 { fill: var(--ink-2); font-size: 12px; }
.pt-ring { fill: transparent; stroke: none; }

.tip { position: fixed; z-index: 10; pointer-events: none; min-width: 160px; max-width: 300px; background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 12px; box-shadow: 0 0 0 1px var(--border), 0 8px 24px rgba(0, 0, 0, 0.14); font-size: 13px; }
.tip[hidden] { display: none; }
.tip .t-strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.tip .t-2 { color: var(--ink-2); }

.notes { margin-top: 26px; color: var(--muted); font-size: 13px; max-width: 860px; }
.notes p { margin: 0 0 8px; }
.next-link { display: inline-block; margin-top: 8px; font-weight: 600; }

@media (max-width: 860px) {
  .panels { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .card { padding: 16px; }
  .cost { grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .hero-col { grid-column: 1 / -1; justify-self: start; text-align: left; }
  .hero-figure { font-size: 48px; }
  .push-right { margin-left: 0; }
  .step-text { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #svgB { transition: none; }
}
</style>

<script>
(function () {
  "use strict";

  var TS = [2, 4, 8, 16];
  var STEP_MS = [0, 2400, 1800, 2400, 1500, 1500];
  var READ_MS = 5200;
  var MEASURED = 2.1; // best measured single-layer forward speedup at T = 4, paper Table 1

  function sp(t) { return (t * t) / (2 * (t - 1)); }
  function spText(t) { return sp(t).toFixed(2); }

  // ---------------------------------------------------------------- strings
  var STR = {
    en: {
      navHub: "All demos", navS1: "Throughput race", navS2: "How it works",
      eyebrow: "Demo S2 · the principle",
      title: "Why is it faster?",
      lede: "An equivariant linear layer is a group convolution in disguise. In the Fourier domain the T × T circulant matrix becomes T independent products, and the symmetry of real signals lets us skip almost half of them. Step through it, or change the group size T.",
      tLabel: "Group size T", shuffle: "New numbers",
      prev: "Previous step", next: "Next step", play: "▶ Play", pause: "❚❚ Pause",
      kicker: function (n) { return "Step " + n + " of 5"; },
      capA: ["Group domain", "naive layer"], capB: ["Fourier domain", "Flash EQ-Linear"],
      hdrW: "W (circulant)", hdrD: "diag(ŵ)", idft: "IDFT",
      lgReal: "real value (bar shows sign and size)",
      lgComplex: "complex value (arrow shows magnitude and phase)",
      lgMirror: "mirror of another frequency, free",
      costTitle: "Real multiplications", costPer: " per channel pair, per token",
      naive: "Naive", flash: "Flash EQ-Linear",
      speedupLabel: function (t) { return "theoretical speedup at T = " + t; },
      match: function (d) { return "✓ Same y as the naive layer (largest difference " + d + ", floating-point rounding)"; },
      matchExact: "✓ Same y as the naive layer, bit for bit",
      tokReal: function (k) { return "k = " + k + ": real frequency, 1 multiplication"; },
      tokComplex: function (k) { return "k = " + k + ": complex frequency, 4 real multiplications"; },
      tokFree: function (k, m) { return "k = " + k + ": mirror of k = " + m + ", free"; },
      tokNaive: function (t, n) { return "Row " + t + " of W · x: " + n + " multiplications"; },
      kindReal: "real frequency", kindComplex: "complex frequency",
      kindMirror: function (m) { return "mirror of k = " + m + " (free)"; },
      zeroTip: "0: off-diagonal entries vanish in the Fourier basis",
      flashY: "Flash", naiveY: "naive",
      steps: [
        { title: "The naive layer: a circulant matrix",
          body: function (t) {
            return "An equivariant linear layer for the cyclic group C<sub>" + t + "</sub>" + (t === 4 ? " (p4, rotations by 90°)" : "") +
              " gives every channel " + t + " orientation copies. Each pair of input and output channels is mixed by a " + t + " × " + t +
              " circulant matrix: every row is the row above shifted by one place. Computing y = W · x takes " + t + " × " + t + " = " + t * t +
              " multiplications per channel pair.";
          },
          formula: function () { return "y<sub>t</sub> = Σ<sub>s</sub> w<sub>(t−s) mod T</sub> · x<sub>s</sub>"; } },
        { title: "Fourier transform along the group axis",
          body: function (t) {
            return "Apply a length-" + t + " DFT to the orientation axis. By the convolution theorem, a circulant matrix is diagonal in the Fourier basis: the " +
              t + " × " + t + " matrix collapses to " + t + " numbers ŵ<sub>k</sub>, and x becomes its spectrum x̂<sub>k</sub>. The DFT runs once per channel, not once per channel pair.";
          },
          formula: function () { return "x̂<sub>k</sub> = Σ<sub>s</sub> x<sub>s</sub> e<sup>−2πi·ks/T</sup> &nbsp;&nbsp;·&nbsp;&nbsp; F W F<sup>−1</sup> = diag(ŵ)"; } },
        { title: "One product per frequency",
          body: function (t) {
            if (t === 2) return "Each frequency now needs a single product ŷ<sub>k</sub> = ŵ<sub>k</sub> · x̂<sub>k</sub>. With T = 2 both frequencies (k = 0 and k = 1) are real, so this costs 2 multiplications instead of 4.";
            return "Each frequency now needs a single product ŷ<sub>k</sub> = ŵ<sub>k</sub> · x̂<sub>k</sub>. Frequencies k = 0 and k = " + t / 2 +
              " are real and cost 1 multiplication each; the other " + (t - 2) + " are complex and cost 4 real multiplications each. Total: " +
              (4 * t - 6) + " instead of " + t * t + ".";
          },
          formula: function () { return "ŷ<sub>k</sub> = ŵ<sub>k</sub> · x̂<sub>k</sub>"; } },
        { title: "Conjugate symmetry: half the spectrum is free",
          body: function (t) {
            if (t === 2) return "Real inputs have conjugate-symmetric spectra, x̂<sub>T−k</sub> = conj(x̂<sub>k</sub>). With T = 2 there is no mirrored pair to skip, so the count stays at 2.";
            var mirror = t === 4 ? "Frequency k = 3 mirrors k = 1." :
              "Frequencies k = " + (t / 2 + 1) + " … " + (t - 1) + " mirror k = " + (t / 2 - 1) + " … 1.";
            return "Inputs and weights are real, so their spectra are conjugate-symmetric: x̂<sub>T−k</sub> = conj(x̂<sub>k</sub>), and the same holds for ŵ and ŷ. " +
              mirror + " Only k = 0 … " + t / 2 + " are computed: " + (2 * t - 2) + " multiplications.";
          },
          formula: function () { return "x̂<sub>T−k</sub> = conj(x̂<sub>k</sub>) &nbsp;⇒&nbsp; ŷ<sub>T−k</sub> = conj(ŷ<sub>k</sub>)"; } },

    for (var k = 1; k < T / 2; k++) {

    var q = T <= 2 ? 16 : T <= 4 ? 14 : T <= 8 ? 10 : 7;

  // ---------------------------------------------------------------- draw (tau in [0, 5])
  function draw() {
    if (!els) return;
    var d = data, L = els.L, s = L.s;
    // step 1: rows of W · x
    var rowsA = tau >= 1 ? T : Math.max(0, Math.floor(tau * T + 1e-9));
    var activeA = tau < 1 ? Math.min(T - 1, rowsA) : -1;
    setHi(els.hiA1, activeA >= 0, L.A.mat - 3, L.top + activeA * s, T * s + 6, s);

    els.yCells.forEach(function (c, t) { c.glyph.set(d.yN[t], els.vmaxY, t < rowsA ? 1 : 0, t < rowsA); });

    // step 2: change of basis
    $("svgB").style.opacity = tau <= 1 ? 0.3 : 0.3 + 0.7 * clamp01((tau - 1) / 0.3);
    var diagP = clamp01((tau - 1) / 0.75), specP = clamp01((tau - 1.2) / 0.6);
    els.dCells.forEach(function (row, t) {
      row.forEach(function (c, cc) {
        c.copy.g.setAttribute("opacity", 1 - diagP);
        if (t === cc) c.ph.set(d.Wh[t], els.zmaxW, specP);
        else if (c.zero) c.zero.setAttribute("opacity", 0.9 * diagP);
      });
    });
    els.xh.forEach(function (c, k) { c.ph.set(d.X[k], els.zmaxX, specP); });

    // step 3: one product per frequency
    var rowsB = tau >= 3 ? T : tau < 2 ? 0 : Math.floor((tau - 2) * T + 1e-9);
    var activeB = tau >= 2 && tau < 3 ? Math.min(T - 1, rowsB) : -1;
    setHi(els.hiB1, activeB >= 0, L.B.mat - 3, L.top + activeB * s, T * s + 6, s);
    setHi(els.hiB2, activeB >= 0, L.B.x - 3, L.top + activeB * s, s + 6, s);
    setHi(els.hiB3, activeB >= 0, L.B.y - 3, L.top + activeB * s, s + 6, s);
    els.yh.forEach(function (c, k) { c.ph.set(d.Yh[k], els.zmaxY, k < rowsB ? 1 : 0); });

    // step 4: conjugate symmetry
    var cP = T > 2 ? clamp01((tau - 3) / 0.6) : 0;
    for (var k = 0; k < T; k++) {
      var op = isMirror(k) ? 1 - 0.62 * cP : 1;
      els.dCells[k][k].ph.g.setAttribute("opacity", op);
      els.xh[k].g.setAttribute("opacity", op);
      els.yh[k].g.setAttribute("opacity", op);
    }
    els.arcs.forEach(function (arc) { arc.setAttribute("opacity", cP); });

    // step 5: inverse DFT
    var fP = clamp01((tau - 4) / 0.6);
    els.yf.forEach(function (c, t) { c.glyph.set(d.yF[t], els.vmaxY, fP, fP >= 1); });
    els.idft.setAttribute("opacity", 0.3 + 0.7 * fP);

    // tokens and counts
    els.naiveTok.forEach(function (tk, i) { tk.classList.toggle("on", Math.floor(i / T) < rowsA); });
    var freeOn = T > 2 && tau >= 3.35;
    els.flashTok.forEach(function (tk) {
      var free = freeOn && isMirror(tk._k);
      tk.classList.toggle("on", tk._k < rowsB && !free);
      tk.classList.toggle("free", free);
    });
    $("naiveCount").textContent = String(rowsA * T);
    var fc = null;
    if (step >= 3) {
      fc = 0;
      for (k = 0; k < rowsB; k++) if (!(freeOn && isMirror(k))) fc += cost(k);
    }
    $("flashCount").textContent = fc === null ? "–" : String(fc);
    var showSp = tau >= 4.35;
    $("speedup").textContent = spText(T) + "×";
    $("speedup").classList.toggle("pending", !showSp);
    $("match").textContent = tau >= 4.7 ? (d.diff === 0 ? S().matchExact : S().match(fmtSci(d.diff))) : "";
  }

    $("nextBtn").setAttribute("aria-label", S().next);
    $("prevBtn").title = S().prev;
    $("nextBtn").title = S().next;
  }
  function applyTheme() {
    var root = document.documentElement;
    if (theme !== "auto") root.setAttribute("data-theme", theme);
    else if (hostTheme) root.setAttribute("data-theme", hostTheme);
    else root.removeAttribute("data-theme");
    var name = theme === "auto" ? S().themeAuto : theme === "light" ? S().themeLight : S().themeDark;
    $("themeBtn").textContent = (theme === "auto" ? "◐" : theme === "light" ? "☀" : "☾") + " " + name;
    $("themeBtn").setAttribute("aria-label", S().themeAria(name));
  }
  $("themeBtn").addEventListener("click", function () {
    theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto";
    save("feq-theme", theme);
    applyTheme();
  });
  function applyLang() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = (lang === "zh" ? "加速原理" : "How It Works") + " · Flash EQ-Linear";
    document.querySelectorAll("[data-i18n]").forEach(function (node) {
      var v = S()[node.getAttribute("data-i18n")];
      if (typeof v === "string") node.textContent = v;
    });
    document.querySelectorAll("[data-lang]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    applyTheme();
    applyCaptions();
    buildLegend();
    buildDots();
    buildTSeg();
    buildChartLegend();
    buildScaleTable();
    renderScaling();
    build();
    updateStepText();
    setPlaying(playing);
    draw();
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.getAttribute("data-lang");
      save("feq-lang", lang);
      applyLang();
    });
  });

  // ---------------------------------------------------------------- boot
  var resizeTimer = 0;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderScaling, 120);
  });
  applyLang();
  tau = 0;
  draw();
  // ?step=N opens the page on the finished state of step N, without autoplay.
  var initStep = Math.max(0, Math.min(5, parseInt(params.get("step"), 10) || 0));
  if (initStep) { started = true; goStep(initStep, false); }
  function start() {
    if (started) return;
    started = true;
    setPlaying(!reduceMotion);
    goStep(1, true);
  }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) { io.disconnect(); start(); }
    }, { threshold: 0.35 });
    io.observe($("stageCard"));
  } else {
    start();
  }
})();
</script>
</body>
</html>
